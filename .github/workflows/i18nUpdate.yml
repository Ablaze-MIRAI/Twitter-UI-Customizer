name: i18n Update

on:
  push:
    branches:
      - main
    paths:
      - i18n/_langList.ts
      - i18n/_officialTwitterI18n.ts
      - i18n/_officialTwitterI18nConfig.ts
      - scripts/update-i18n.ts
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-i18n:
    if: github.repository_owner == 'Ablaze-MIRAI' || github.event_name == 'workflow_dispatch'
    name: Update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          cache: true
          install: false

      - name: Update
        run: |
          pnpm ci
          git checkout -- .
          git pull
          node ./scripts/update-i18n.ts

          if [ -z "$(git status --porcelain)" ]; then
            echo "::notice::No ti18n changes"
            exit 0
          fi

          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update twitter i18n"
          git push
          echo "::notice::Committed and pushed ti18n changes"
